services:

  # =========================================================
  # MYSQL
  # =========================================================

  mysql:
    image: mysql:8.4
    container_name: tickethub-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}

    ports:
      - "3306:3306"

    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-uroot",
          "-p${DB_PASSWORD}"
        ]
      interval: 10s
      timeout: 5s
      retries: 10


  # =========================================================
  # KAFKA - KRaft
  # =========================================================

  kafka:
    image: apache/kafka:4.0.0
    container_name: tickethub-kafka
    restart: unless-stopped

    ports:
      - "9092:9092"

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"
        ]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 20s


  # =========================================================
  # EUREKA SERVER
  # =========================================================

  eureka-server:
    build:
      context: ./eureka-server

    container_name: tickethub-eureka

    ports:
      - "8761:8761"

    restart: unless-stopped


  # =========================================================
  # AUTH SERVICE
  # =========================================================

  auth-service:
    build:
      context: ./auth-service

    container_name: tickethub-auth-service
    restart: unless-stopped

    ports:
      - "8084:8084"

    environment:
      SERVER_PORT: 8084

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/auth_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      EUREKA_ENABLED: ${EUREKA_ENABLED}
      EUREKA_URL: ${EUREKA_URL}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES}
      JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS}

      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION}

      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}

      BOOTSTRAP_ADMIN_ENABLED: ${BOOTSTRAP_ADMIN_ENABLED}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}

      TOKEN_CLEANUP_MS: ${TOKEN_CLEANUP_MS}

    depends_on:
      mysql:
        condition: service_healthy

      eureka-server:
        condition: service_started


  # =========================================================
  # EVENT SERVICE
  # =========================================================

  event-service:
    build:
      context: ./event-service

    container_name: tickethub-event-service
    restart: unless-stopped

    ports:
      - "8081:8081"

    environment:
      SERVER_PORT: 8081

      SPRING_APPLICATION_NAME: event-show-service

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/event_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS}

      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}

    depends_on:
      mysql:
        condition: service_healthy

      eureka-server:
        condition: service_started


  # =========================================================
  # BOOKING SERVICE
  # =========================================================

  booking-service:
    build:
      context: ./booking-service

    container_name: tickethub-booking-service
    restart: unless-stopped

    ports:
      - "8082:8082"

    environment:
      SERVER_PORT: 8082

      SPRING_APPLICATION_NAME: booking-service

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/booking_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      EUREKA_URL: ${EUREKA_URL}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

      EVENT_SERVICE_URL: ${EVENT_SERVICE_URL}
      EVENT_SERVICE_USE_EUREKA: ${EVENT_SERVICE_USE_EUREKA}

      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}

      BOOKING_HOLD_EXPIRY_SECONDS: ${BOOKING_HOLD_EXPIRY_SECONDS}
      BOOKING_EXPIRY_CHECK_MS: ${BOOKING_EXPIRY_CHECK_MS}
      BOOKING_OUTBOX_RELAY_MS: ${BOOKING_OUTBOX_RELAY_MS}

      BOOKING_NOTIFICATION_ZONE: ${BOOKING_NOTIFICATION_ZONE}

      BOOKING_CONFIRMED_TOPIC: ${BOOKING_CONFIRMED_TOPIC}
      PAYMENT_FAILED_TOPIC: ${PAYMENT_FAILED_TOPIC}
      BOOKING_CANCELLED_TOPIC: ${BOOKING_CANCELLED_TOPIC}
      PAYMENT_SUCCEEDED_TOPIC: ${PAYMENT_SUCCEEDED_TOPIC}
      BOOKING_REJECTED_TOPIC: ${BOOKING_REJECTED_TOPIC}
      PAYMENT_REFUNDED_TOPIC: ${PAYMENT_REFUNDED_TOPIC}

    depends_on:
      mysql:
        condition: service_healthy

      eureka-server:
        condition: service_started

      kafka:
        condition: service_healthy

      event-service:
        condition: service_started

      payment-service:
        condition: service_started


  # =========================================================
  # PAYMENT SERVICE
  # =========================================================

  payment-service:
    build:
      context: ./payment-service

    container_name: tickethub-payment-service
    restart: unless-stopped

    ports:
      - "8083:8083"

    environment:
      SERVER_PORT: 8083

      SPRING_APPLICATION_NAME: payment-service

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/payment_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      EUREKA_ENABLED: ${EUREKA_ENABLED}
      EUREKA_URL: ${EUREKA_URL}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

      JWT_SECRET: ${JWT_SECRET}
      INTERNAL_JWT_SECRET: ${INTERNAL_JWT_SECRET}

      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER}

      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}

      MOCK_PROVIDER_LATENCY_MS: ${MOCK_PROVIDER_LATENCY_MS}

      BOOKING_CLIENT: ${BOOKING_CLIENT}
      BOOKING_SERVICE_URL: ${BOOKING_SERVICE_URL}

      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}
      PAYMENT_SUCCEEDED_TOPIC: ${PAYMENT_SUCCEEDED_TOPIC}
      PAYMENT_FAILED_TOPIC: ${PAYMENT_FAILED_TOPIC}
      PAYMENT_REFUNDED_TOPIC: ${PAYMENT_REFUNDED_TOPIC}
      BOOKING_REJECTED_TOPIC: ${BOOKING_REJECTED_TOPIC}
      BOOKING_CANCELLED_TOPIC: ${BOOKING_CANCELLED_TOPIC}

    depends_on:
      mysql:
        condition: service_healthy

      eureka-server:
        condition: service_started

      kafka:
        condition: service_healthy


  # =========================================================
  # NOTIFICATION SERVICE
  # =========================================================

  notification-service:
    build:
      context: ./notification-service

    container_name: tickethub-notification-service
    restart: unless-stopped

    ports:
      - "8085:8085"

    environment:
      SERVER_PORT: 8085

      SPRING_APPLICATION_NAME: notification-service

      SPRING_PROFILES_ACTIVE: local

      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}

      SPRING_KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS}

      EUREKA_URL: ${EUREKA_URL}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

      NOTIFICATION_DELIVERY_MODE: ${NOTIFICATION_DELIVERY_MODE}

      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}

      BOOKING_CONFIRMED_TOPIC: ${BOOKING_CONFIRMED_TOPIC}
      BOOKING_CANCELLED_TOPIC: ${BOOKING_CANCELLED_TOPIC}
      PAYMENT_FAILED_TOPIC: ${PAYMENT_FAILED_TOPIC}

    depends_on:
      mysql:
        condition: service_healthy

      eureka-server:
        condition: service_started

      kafka:
        condition: service_healthy


  # =========================================================
  # API GATEWAY
  # =========================================================

  api-gateway:
    build:
      context: ./api-gateway

    container_name: tickethub-api-gateway
    restart: unless-stopped

    ports:
      - "8080:8080"

    environment:
      SERVER_PORT: 8080

      SPRING_APPLICATION_NAME: API-GATEWAY

      EUREKA_URL: ${EUREKA_URL}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_URL}
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

      JWT_SECRET: ${JWT_SECRET}

    depends_on:
      eureka-server:
        condition: service_started

      auth-service:
        condition: service_started

      event-service:
        condition: service_started

      booking-service:
        condition: service_started

      payment-service:
        condition: service_started

      notification-service:
        condition: service_started


  # =========================================================
  # REACT UI
  # =========================================================

#  razorpay-ui:
#    build:
#      context: ./razorpay-ui
#
#    container_name: tickethub-ui
#
#    ports:
#      - "3000:80"
#
#    depends_on:
#      - api-gateway


  # =========================================================
  # CENTRALIZED LOGGING: LOKI + PROMTAIL + GRAFANA
  # =========================================================

  loki:
    image: grafana/loki:3.0.0
    container_name: tickethub-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    container_name: tickethub-promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/promtail/promtail-config.yaml:/etc/promtail/config.yaml
    command: -config.file=/etc/promtail/config.yaml
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    container_name: tickethub-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped


  # =========================================================
  # METRICS & OBSERVABILITY: PROMETHEUS
  # =========================================================

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: tickethub-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    restart: unless-stopped


  # =========================================================
  # KAFKA UI (Scenario 0 Inspection)
  # =========================================================

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: tickethub-kafka-ui
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: tickethub-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped


# =========================================================
# VOLUMES
# =========================================================

volumes:
  mysql-data:
  loki-data:
  grafana-data:
  prometheus-data:

