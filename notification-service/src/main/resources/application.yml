server:
  port: 8085

spring:
  application:
    name: notification-service
  profiles:
    active: local

  datasource:
    url: jdbc:mysql://localhost:3306/notification_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      # Plain String: JSON is parsed inside the service (safe against bad messages)
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

kafka:
  topic:
    booking-confirmed: tickethub.booking.confirmed
    booking-cancelled: tickethub.booking.cancelled
    payment-failed: tickethub.payment.failed

notification:
  # SMTP = really send e-mail through the TicketHub Gmail account (default)
  # LOG  = only print the e-mail in the console (no Gmail needed)
  delivery-mode: ${NOTIFICATION_DELIVERY_MODE:SMTP}
  retry:
    max-attempts: 5
    interval-ms: 60000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
